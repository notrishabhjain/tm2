org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Fallback release signing.
#
# The APK must be signed with a STABLE key or in-app self-update (spec S19)
# cannot replace an existing install. The canonical source of the key is the
# repository-secret path in .github/workflows/build.yml (KEYSTORE_BASE64 etc).
# When those secrets are absent the workflow falls back to the checked-in
# keystore at ci/taskmind-release.jks, whose credentials are below.
#
# This is a deliberate trade-off for a sideloaded personal build with no
# developer machine available: a publicly known key means anyone can build an
# APK that upgrades this install, so do NOT reuse this key for anything you
# publish. See ci/README.md for how to swap in your own.
# ---------------------------------------------------------------------------
taskmind.fallbackStorePassword=taskmind
taskmind.fallbackKeyAlias=taskmind
taskmind.fallbackKeyPassword=taskmind
